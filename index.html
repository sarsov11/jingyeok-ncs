<script>
/* 합격전략 — 첫 방문의 「목표 기업과 직렬」 고르기가 끝난 뒤 한 번 튜토리얼, 이후엔 오른쪽 아래 「합격전략」 버튼 */
(function () {
  function go() {
    if (document.getElementById("oq") && !document.querySelector(".card.org")) return false;
    ZZSTRAT.auto("ncs"); return true;
  }
  if (go()) return;
  var mo = new MutationObserver(function () { if (go()) mo.disconnect(); });
  mo.observe(document.getElementById("app"), { childList: true });
})();
</script>
