<script>
/* 11-05 대표님: 학생 조사 없이 과목 설명부터 하지 말 것 · 기업군마다 모을 것(발전 5사·교통공사·A/B매치 등) · KB국민은행식 질문.
   첫 방문: 첫 설정(기업군 → 기관 → 직무 → 공부 경험·시험 시기·하루 시간·목표) → 합격전략 이야기 → 홈. 기업군 전략(ncs_<기업군>)이 있으면 그걸 연다. */
(function () {
  var GROUPS = [
    { v: "power", label: "발전 5사·한수원", sub: "남동·남부·동서·서부·중부발전, 한국수력원자력", re: /남동발전|남부발전|동서발전|서부발전|중부발전|수력원자력/ },
    { v: "kepco", label: "한전과 전력 계열", sub: "한국전력공사, 한전KDN·KPS·원자력연료, 전기안전공사", re: /한국전력공사|한전|전기안전공사/ },
    { v: "rail", label: "철도·교통공사", sub: "코레일, 대구·부산교통공사", re: /철도공사|교통공사/ },
    { v: "soc", label: "도로·국토·공항", sub: "도로공사, 도로교통공단, LH, LX, 인천국제공항공사", re: /도로공사|도로교통공단|토지주택|국토정보|국제공항/ },
    { v: "energy", label: "가스·석유·에너지", sub: "가스공사, 가스안전공사, 석유공사, 지역난방공사 등", re: /가스|석유|광해광업|지역난방|에너지공단|원자력환경/ },
    { v: "welfare", label: "보건·복지·고용", sub: "건강보험공단, 심평원, 국민연금, 근로복지공단 등", re: /건강보험|심사평가원|국민연금|근로복지|보훈복지|사회보장정보원|산업인력|장학재단/ },
    { v: "finance", label: "금융 공기업", sub: "신보, 기보, 예보, 캠코, 무보, 주택금융공사", re: /보증기금|예금보험|자산관리공사|무역보험|주택금융/ },
    { v: "etc", label: "그 밖의 기관", sub: "KOTRA 등", re: null },
    { v: "none", label: "아직 안 정했어요", sub: "10개 영역을 고루 연습해요", re: false }
  ];
  function orgs() { return window.NCS_ORGS || []; }
  function inGroup(g, o) {
    if (g.re) return g.re.test(o.n);
    if (g.re === null) return !GROUPS.some(function (x) { return x.re && x.re.test(o.n); });
    return false;
  }
  function groupOf(v) { return GROUPS.filter(function (g) { return g.v === v; })[0]; }
  /* 테라러닝 첫 화면에서 기업군을 이미 골라 왔으면(?g=power) 그 질문은 건너뛴다 */
  var PRE = (location.search.match(/[?&]g=([a-z]+)/) || [])[1] || "";
  if (PRE && !groupOf(PRE)) PRE = "";
  function grp(a) { return a.group || PRE; }
  function go() {
    if (window.NCS_HAS_ORG && window.NCS_HAS_ORG()) { ZZSTRAT.auto("ncs", { fab: false, setup: false }); return; }
    ZZSTRAT.auto("ncs", { fab: false, delay: 300, setup: {
      key: "ncs", 이름: "진격의 NCS",
      끝말: "좋아요. 이제 **이 기업군 필기 붙는 길**부터 볼게요.",
      steps: [
        { id: "group", k: "기업군", when: function () { return !PRE; }, q: "어느 쪽 공기업을 준비하세요?", sub: "기업군마다 필기 영역과 전공이 달라요.", options: GROUPS.map(function (g) { return { v: g.v, label: g.label, sub: g.sub }; }) },
        { id: "org", k: "기관", q: function (a) { return PRE ? groupOf(PRE).label + " 중에서 어디예요?" : "그중에서 어디예요?"; }, when: function (a) { return grp(a) && grp(a) !== "none"; },
          options: function (a) { var g = groupOf(grp(a)); return orgs().filter(function (o) { return inGroup(g, o); }).map(function (o) { return { v: o.n, label: o.n, sub: o.t }; }).concat([{ v: "*", label: "아직 한 곳으로 못 정했어요", sub: "이 기업군 공통 영역으로 연습해요" }]); } },
        { id: "job", k: "직무", q: "어떤 직무로 지원해요?", when: function (a) { return a.org && a.org !== "*"; },
          options: function (a) { var o = orgs().filter(function (x) { return x.n === a.org; })[0]; return o ? o.j.map(function (j) { return { v: j.n, label: j.n, sub: j.a.join(" · ") + (j.s && j.s.length ? " · 전공 " + j.s.join(", ") : "") }; }) : []; } }
      ],
      pickId: function (a) { return "ncs_" + grp(a); },
      done: function (a) { if (window.NCS_SET_MIN && a.time) window.NCS_SET_MIN(+a.time); if (window.NCS_SET_ORG) window.NCS_SET_ORG(a.org && a.org !== "*" ? a.org : null, a.job || null); }
    } });
  }
  if (window.ZZSTRAT) go(); else addEventListener("DOMContentLoaded", go);
})();
</script>
